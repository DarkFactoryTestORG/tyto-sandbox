name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'
  DATABASE_URL: postgres://plotline:plotline@localhost:5432/plotline
  NEXTEST_VERSION: 0.9.120

jobs:
  checks:
    name: lint, typecheck, format, clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint
      - run: pnpm turbo run typecheck
      - run: pnpm format:check

  test:
    name: unit, integration and Rust tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plotline
          POSTGRES_PASSWORD: plotline
          POSTGRES_DB: plotline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plotline" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run test
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Test results
          report_paths: reports/junit/**/*.xml
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plotline
          POSTGRES_PASSWORD: plotline
          POSTGRES_DB: plotline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plotline" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotline/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: E2E report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: E2E results
          report_paths: reports/junit/e2e.xml
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
