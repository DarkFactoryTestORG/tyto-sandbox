name: changelog

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  changelog-format:
    name: changelog-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-changelog.mjs "origin/${{ github.base_ref }}"
