name: Smoke
description: "The factory's smoke test: one changelog entry through every generic brick."
title: '[smoke] '
body:
  - type: markdown
    attributes:
      value: 'A smoke issue adds one changelog entry and runs every generic brick of
        the factory. Test-only indicators, anywhere in the body:
        `[tyto:smoke:clarify]`, `[tyto:smoke:egress]`,
        `[tyto:smoke:misbehave:switch-branch]`,
        `[tyto:smoke:misbehave:rewrite-history]`.'
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: 'One sentence: what the changelog entry should say.'
      value: Record this issue in the changelog.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: One "In:" line and any "Out:" lines.
      value: |-
        In: one new line in CHANGELOG.md under Unreleased
        Out: any other file; changes to existing changelog entries
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: 'One per line: Rn <requirement>.'
      value: R1 CHANGELOG.md has one new entry that describes this issue's Summary in
        one line
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 'One per line: Tn <title> (the requirements it satisfies).'
      value: T1 Add the changelog entry (R1)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: 'One per line: En [test|api|ui|cli] <what it shows>.'
      value: E1 [test] The lint and format gates pass with the new entry
    validations:
      required: true
projects:
  - DarkFactoryTestORG/1
labels:
