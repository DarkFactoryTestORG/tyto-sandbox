        - Lavender (#b39ddb)
        - Custom (the hex under Custom colour)
      default: 0
    validations:
      required: true
  - type: input
    id: custom
    attributes:
      label: Custom colour
      description: 'Only for Custom: a hex colour, e.g. #33aa77.'
