[package]
name = "textkit-node"
version = "0.1.0"
description = "Node binding for the textkit crate"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { version = "2.16.17", default-features = false, features = ["napi4"] }
napi-derive = "2.16.13"
textkit = { path = "../../crates/textkit" }

[build-dependencies]
napi-build = "2.2.0"
